# docker-compose.prod.yml — CanvasSync Azure 2-VM production stack
#
# Deployment topology (both VMs in one VNet, 1 GB RAM each — hence mem limits).
# The App VM also runs the Knowdex backend (see the Knowdex repo).
#
#   App VM    (B2ats v2, x86, public IP — ports 22/80/443 only):
#     docker compose -f docker-compose.prod.yml up -d caddy http-backend ws-backend ai-worker
#
#   Data VM   (B2pts v2, ARM, private only):
#     docker compose -f docker-compose.data.yml up -d   (separate file so each
#     VM's .env only needs its own variables)
#
# Managed services (not in this file):
#   - PostgreSQL → Azure Database for PostgreSQL Flexible Server (private access)
#
# Public routing (Caddy on the App VM, automatic HTTPS):
#   api.canvassync.tech  → WebSocket upgrades → ws-backend :8081
#                        → everything else    → http-backend :3001
#   ws.canvassync.tech   → ws-backend :8081
#   api.knowdex.me / ws.knowdex.me → Knowdex containers (separate compose
#   project in /opt/knowdex, reached over the external `edge` network)

services:

  # ── App VM services ───────────────────────────────────────────────────────────

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - edge   # reaches the Knowdex containers (see Caddyfile)
    depends_on:
      - http-backend
      - ws-backend
    mem_limit: 64m
    restart: unless-stopped

  http-backend:
    image: ghcr.io/${GITHUB_REPO}/canvas-http-backend:latest
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      RABBITMQ_URL: ${RABBITMQ_URL:?RABBITMQ_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?INTERNAL_SECRET is required}
      WEB_APP_URL: ${WEB_APP_URL:?WEB_APP_URL is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      GMAIL_FROM_EMAIL: ${GMAIL_FROM_EMAIL:-}
      HTTP_RATE_LIMIT_WINDOW_MS: ${HTTP_RATE_LIMIT_WINDOW_MS:-60000}
      HTTP_RATE_LIMIT_MAX_REQUESTS: ${HTTP_RATE_LIMIT_MAX_REQUESTS:-120}
      DB_CIRCUIT_BREAKER_ENABLED: ${DB_CIRCUIT_BREAKER_ENABLED:-true}
      DB_RETRY_ATTEMPTS: ${DB_RETRY_ATTEMPTS:-3}
      DB_RETRY_BASE_DELAY_MS: ${DB_RETRY_BASE_DELAY_MS:-75}
      DB_CIRCUIT_FAILURE_THRESHOLD: ${DB_CIRCUIT_FAILURE_THRESHOLD:-5}
      DB_CIRCUIT_WINDOW_MS: ${DB_CIRCUIT_WINDOW_MS:-60000}
      DB_CIRCUIT_OPEN_MS: ${DB_CIRCUIT_OPEN_MS:-30000}
      DB_CIRCUIT_HALF_OPEN_SUCCESS_THRESHOLD: ${DB_CIRCUIT_HALF_OPEN_SUCCESS_THRESHOLD:-2}
      RABBITMQ_AI_GENERATE_EXCHANGE: ${RABBITMQ_AI_GENERATE_EXCHANGE:-canvas.ai.generate}
      RABBITMQ_AI_GENERATE_QUEUE: ${RABBITMQ_AI_GENERATE_QUEUE:-canvas.ai.generate.jobs}
      RABBITMQ_AI_GENERATE_ROUTING_KEY: ${RABBITMQ_AI_GENERATE_ROUTING_KEY:-ai.generate}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      GH_CLIENT_ID: ${GH_CLIENT_ID:-}
      GH_CLIENT_SECRET: ${GH_CLIENT_SECRET:-}
      GH_CALLBACK_URL: ${GH_CALLBACK_URL:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 384m
    restart: unless-stopped

  ws-backend:
    image: ghcr.io/${GITHUB_REPO}/canvas-ws-backend:latest
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
      WS_PORT: 8081
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      RABBITMQ_URL: ${RABBITMQ_URL:?RABBITMQ_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?INTERNAL_SECRET is required}
      WS_ENABLE_DURABLE_QUEUE: ${WS_ENABLE_DURABLE_QUEUE:-true}
      WS_DEBUG_ERRORS: ${WS_DEBUG_ERRORS:-false}
      RABBITMQ_AI_GENERATE_EXCHANGE: ${RABBITMQ_AI_GENERATE_EXCHANGE:-canvas.ai.generate}
      RABBITMQ_AI_GENERATE_QUEUE: ${RABBITMQ_AI_GENERATE_QUEUE:-canvas.ai.generate.jobs}
      RABBITMQ_AI_GENERATE_ROUTING_KEY: ${RABBITMQ_AI_GENERATE_ROUTING_KEY:-ai.generate}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 384m
    restart: unless-stopped

  # ── App VM: AI worker ─────────────────────────────────────────────────────────
  # Outbound only: RabbitMQ (data VM), Postgres, Gemini API, and the
  # http-backend callback over this compose network.

  ai-worker:
    image: ghcr.io/${GITHUB_REPO}/canvas-ai-worker:latest
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      RABBITMQ_URL: ${RABBITMQ_URL:?RABBITMQ_URL is required}
      RABBITMQ_AI_GENERATE_EXCHANGE: ${RABBITMQ_AI_GENERATE_EXCHANGE:-canvas.ai.generate}
      RABBITMQ_AI_GENERATE_QUEUE: ${RABBITMQ_AI_GENERATE_QUEUE:-canvas.ai.generate.jobs}
      RABBITMQ_AI_GENERATE_ROUTING_KEY: ${RABBITMQ_AI_GENERATE_ROUTING_KEY:-ai.generate}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      GEMINI_MODEL_CANDIDATES: ${GEMINI_MODEL_CANDIDATES:-gemini-2.5-flash,gemini-2.5-flash-lite}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?INTERNAL_SECRET is required}
      HTTP_BACKEND_INTERNAL_URL: http://http-backend:3001
    depends_on:
      - http-backend
    mem_limit: 384m
    restart: unless-stopped

networks:
  # Shared with the Knowdex compose project on the App VM. Created by
  # scripts/azure-vm-setup.sh and by the deploy workflows.
  edge:
    external: true

volumes:
  caddy_data:
  caddy_config:
